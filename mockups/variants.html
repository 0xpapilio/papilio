// Sample the traced half-wing grid at x,y in [-1,1]; mirrored left/right. Returns 0 (empty), 1-2 black wing, 3-9 blue.
const at = (u, v) => u < 0 || v < 0 || u >= BF.w || v >= BF.h ? 0 : +BF.d[v * BF.w + u];
function fly(x, y, t) {
  const fu = Math.abs(x) * (BF.w + 5) / (0.93 + 0.07 * Math.cos(t)), u = Math.floor(fu); // flap = squeeze toward the body

  if (c) return c > 2 ? c : (!at(u + 2, v) || !at(u, v + 2) || !at(u, v - 2)) ? 2.5 : c; // 2.5 = outer rim

const BLUES = ['#0044cc', '#0058e6', '#0066FF', '#0080FF', '#0099FF', '#00AAFF', '#33CCFF'];

function draw(cv, t) {
  const n = +cv.dataset.n, cell = 800 / n, st = styles[cv.dataset.style];

  const ctx = cv.getContext('2d');
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
