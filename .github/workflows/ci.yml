name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  no-mainnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-mainnet.sh

  relayer:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: relayer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: relayer/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  leo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { cache-targets: false, cache-all-crates: true }
      - name: Install Leo
        run: cargo install leo-lang --locked
      - name: Leo tests (offline, throwaway key)
        run: bash aleo/papilio_intent/tests/test.sh
